# Re-renders docs/connectors.png with kicad-callouts whenever the board changes
# and commits the result, so the image in README.md stays current.
name: Connector render

on:
  push:
    branches: [main]
    paths:
      - deepsea-light-pcb.kicad_pcb
      - Deepsea_light_lib/**
      - RP-Pico Libraries/**
      - .github/workflows/connectors.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connector-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      # The -full variant includes KiCad's stock 3D models (needed for the Pico).
      image: kicad/kicad:10.0-full
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install kicad-callouts and rsvg-convert
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq librsvg2-bin pipx
          pipx install kicad-callouts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          kicad-callouts deepsea-light-pcb.kicad_pcb -o docs/connectors.png

      - name: Commit if changed
        run: |
          git add docs/connectors.png
          if git diff --cached --quiet; then
            echo "No change to docs/connectors.png"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update connector render"
          git push
